name: Flutter CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    name: Flutter Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Dummy .env
        run: |
          echo "SUPABASE_URL=https://dummy-project.supabase.co" > cricket_academy_flutter/.env
          echo "SUPABASE_ANON_KEY=dummy-key" >> cricket_academy_flutter/.env

      - name: Install dependencies
        run: |
          cd cricket_academy_flutter
          flutter pub get

      - name: Check code linting
        run: |
          cd cricket_academy_flutter
          flutter analyze

      - name: Run unit & widget tests
        run: |
          cd cricket_academy_flutter
          flutter test

      - name: Build debug APK
        run: |
          cd cricket_academy_flutter
          flutter build apk --debug
