name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: https://dummy-project.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy-anon-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read .nvmrc
        id: nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Lint codebase
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run unit & component tests with coverage
        run: npm run test:coverage

      # Only this build gets the E2E auth-injection hook compiled in — it's
      # the one Playwright serves via `vite preview` below. Every other
      # build (including what Vercel deploys) never sets this flag, so the
      # hook never reaches real users.
      - name: Build test bundle for Playwright (E2E auth hook enabled)
        run: npm run build
        env:
          VITE_E2E_TEST_MODE: 'true'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase instance
        run: |
          supabase start
          supabase db reset

      - name: Run Playwright E2E tests
        run: npx playwright test --project=chromium
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM0MTI4MDB9.CRXP_dummy_key_for_ci
